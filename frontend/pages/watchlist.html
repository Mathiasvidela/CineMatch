<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="CineMatch - Mi Watchlist. Organizá las películas y series que querés ver después.">
    <title>CineMatch - Mi Watchlist</title>
    <link rel="shortcut icon" href="../src/isotipo.svg" type="image/x-icon">
    <!-- Link root styling -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar" id="main-navbar">
            <a href="../index.html" class="logo" id="logo-brand"><img src="../src/logotipo.svg"
                    alt="CineMatch Logo"></a>
            <div class="nav-menu" id="navigation-menu">
                <a href="../index.html" class="nav-link" id="nav-discover">Home</a>
                <a href="#" class="nav-link active" id="nav-watchlist">Watchlist</a>
                <a href="login.html" class="nav-link btn-login" id="nav-login">Login <i
                        class="fa-solid fa-right-to-bracket"></i></a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">



        <div class="watchlist-page-container">

            <!-- Hero Section -->
            <section class="watchlist-hero" id="watchlist-hero">
                <h1 class="watchlist-title">Mi Watchlist</h1>
                <p class="watchlist-subtitle">Organizá las películas y series que querés ver después.</p>
                <div class="watchlist-user-greeting" id="watchlist-user-greeting" style="display: none;"></div>
            </section>

            <!-- Desktop Search Button -->
            <div class="watchlist-search-desktop-container">
                <button id="open-search-modal-btn" class="open-search-modal-btn" type="button">
                    <i class="fa-solid fa-magnifying-glass"></i> + Buscar para guardar
                </button>
            </div>

            <!-- Stats Overview -->
            <section class="watchlist-stats-grid" id="watchlist-stats">
                <div class="watchlist-stat-card">
                    <div class="stat-icon-wrapper stat-icon-total">
                        <i class="fa-solid fa-bookmark"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="watchlist-total-count">0</span>
                        <span class="stat-label">Total Guardados</span>
                    </div>
                </div>

                <div class="watchlist-stat-card">
                    <div class="stat-icon-wrapper stat-icon-movies">
                        <i class="fa-solid fa-film"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="watchlist-movie-count">0</span>
                        <span class="stat-label">Películas</span>
                    </div>
                </div>

                <div class="watchlist-stat-card">
                    <div class="stat-icon-wrapper stat-icon-tv">
                        <i class="fa-solid fa-tv"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="watchlist-tv-count">0</span>
                        <span class="stat-label">Series</span>
                    </div>
                </div>
            </section>

            <!-- Filter Tabs -->
            <section class="watchlist-filters" id="watchlist-filters">
                <button type="button" class="watchlist-tab-btn active" data-filter="all" id="filter-all">
                    <i class="fa-solid fa-layer-group"></i> Todo
                </button>
                <button type="button" class="watchlist-tab-btn" data-filter="movie" id="filter-movie">
                    <i class="fa-solid fa-film"></i> Películas
                </button>
                <button type="button" class="watchlist-tab-btn" data-filter="tv" id="filter-tv">
                    <i class="fa-solid fa-tv"></i> Series
                </button>
            </section>

            <!-- Dynamic Content (Grid, Loading, Empty, Blocked, Error) -->
            <section id="watchlist-content">
                <!-- Content will be rendered dynamically by watchlist.js -->
            </section>

        </div>
    </main>

    <!-- Footer Section -->
    <footer class="footer" id="main-footer">
        <a href="../index.html" class="footer-logo" id="footer-brand">CineMatch</a>
        <p class="copyright" id="footer-copyright"></p>
    </footer>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
        <a href="../index.html" class="mobile-bottom-link" id="mobile-nav-home">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
        </a>
        <a href="#" class="mobile-bottom-link active" id="mobile-nav-watchlist">
            <i class="fa-solid fa-heart"></i>
            <span>Watchlist</span>
        </a>
        <a href="movies.html" class="mobile-bottom-link" id="mobile-nav-movies">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Buscar</span>
        </a>
    </nav>

    <button id="mobile-search-fab" class="mobile-search-fab" type="button">
        + Buscar
    </button>

    <!-- Search Modal -->
    <div id="watchlist-search-modal" class="watchlist-search-modal hidden">
        <div class="watchlist-search-overlay"></div>

        <button id="close-search-modal-btn" class="search-modal-back-btn" type="button" aria-label="Cerrar búsqueda">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="watchlist-search-dialog">
            <div class="search-modal-header">
                <h2>Buscar para guardar</h2>
                <p>Encontrá películas o series y agregalas a tu Watchlist.</p>
            </div>

            <form id="watchlist-search-form" class="search-form">
                <input type="text" id="watchlist-search-input" placeholder="Buscar película o serie..." required
                    autocomplete="off">
                <button type="submit" class="btn-search">Buscar</button>
            </form>
            <div id="watchlist-search-message" class="search-message"></div>

            <div id="search-results-section" class="search-results-section">
                <div id="search-results-grid" class="search-results-grid"></div>
            </div>
        </div>
    </div>

    <script src="../app.js"></script>
    <script src="../js/watchlist.js"></script>
</body>

</html>
