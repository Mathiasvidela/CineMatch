<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="CineMatch - Encontrá la película perfecta para vos en menos de un minuto. Deja de scrollear por horas y empezá a disfrutar.">
    <title>CineMatch - Encontrá qué ver en menos de un minuto</title>
    <link rel="shortcut icon" href="../src/isotipo.svg" type="image/x-icon">
    <!-- Link root styling -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar" id="main-navbar">
            <a href="../index.html" class="logo" id="logo-brand"><img src="../src/logotipo.svg" alt=""></a>
            <div class="nav-menu" id="navigation-menu">
                <a href="../index.html" class="nav-link" id="nav-discover">Home</a>
                <a href="watchlist.html" class="nav-link" id="nav-watchlist">Watchlist</a>
                <a href="login.html" class="nav-link btn-login" id="nav-login">Login <i
                        class="fa-solid fa-right-to-bracket"></i></a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <!-- Badge pasos -->
        <div class="pasos">
            <div class="badge-yellow" id="badge-step"></div>
        </div>

        <!-- pasos container -->
        <section id="step-container"></section>

        <!-- botones de accion -->
        <div class="step-actions">
            <button class="btn btn-back" id="btn-back">
                ← Atrás
            </button>

            <button class="btn btn-next" id="btn-next">
                Siguiente →
            </button>
        </div>

    </main>

    <!-- Footer Section -->
    <footer class="footer" id="main-footer">
        <a href="../index.html" class="footer-logo" id="footer-brand">CineMatch</a>
        <p class="copyright" id="footer-copyright"></p>
    </footer>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
        <a href="../index.html" class="mobile-bottom-link" id="mobile-nav-home">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
        </a>
        <a href="watchlist.html" class="mobile-bottom-link" id="mobile-nav-watchlist">
            <i class="fa-solid fa-heart"></i>
            <span>Watchlist</span>
        </a>
        <a href="#" class="mobile-bottom-link active" id="mobile-nav-movies">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Buscar</span>
        </a>
    </nav>

    <script src="../app.js"></script>
</body>

</html>
